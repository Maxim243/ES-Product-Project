elasticsearch:
  fields:
    name: name
    id: _id
  property:
    esHost: ${ES_HOST:http://localhost:9200}
    user: ${ES_USER:}
    password: ${ES_PASS:}
  index:
    index: _index
    indexName: ${ES_INDEX:autopart_index}
    indicesAmount: ${ES_INDICES_COUNT:3}
  file:
    mappings: classpath:autoparts/mappings.json
    settings: classpath:autoparts/settings.json
    bulkData: classpath:autoparts/bulk_data.txt